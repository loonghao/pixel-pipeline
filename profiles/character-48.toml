schema_version = 1
name = "character-48"
fit = "contain"
anchor = "bottom-center"
transparent_margin = 1

[target]
width = 48
height = 48

[alpha]
threshold = 96
coverage_threshold = 0.5
background = "auto"
background_tolerance = 24

[palette]
max_colors = 12
color_space = "oklab"
dithering = "none"
# Posterize is disabled for the quantize-then-snap order: crushing lightness
# *before* the source-resolution palette is built collapses identity colors
# (skin, sunglasses); the 12-color budget already produces flat bands.
posterize_levels = 0
# Quantize-then-snap (PRD §14.5): build the palette at source resolution where
# small identity-critical regions (eyes, skin) still win palette slots.
quantize_source = true
# In sprite-sheet mode, build one palette from all cells and share it across
# every frame (Aseprite-style), so animations never flicker between
# frame-local palettes.
sheet_shared = true

[outline]
width = 1
color = "#2b1009"
connectivity = 8
corner_rule = "pixel-art"
# Internal outlines are off for the quantize-then-snap order: exact palette
# boundaries are already crisp, and edge recoloring eats small features
# (sunglass lenses, eyes). The external outline is unaffected.
internal = false
internal_threshold = 0.12

[cleanup]
min_component_pixels = 1
fill_single_pixel_holes = false
max_body_components = 6

[sampling]
# Majority vote per cell over the already-quantized source (pairs with
# palette.quantize_source): each cell picks its dominant palette color.
mode = "mode"
centroids = 2

[optimize]
# Pixel-art convergence pass (PRD §14.5): Lloyd palette refinement plus
# cluster-cleanliness rules. Deterministic; the palette can only shrink.
palette_iterations = 3
merge_orphans = true
jaggy_cleanup = true

[detail]
# Contrast-aware detail preservation (PRD §14.3), O(n) sliding-window
# implementation. Expands small high-contrast features (hair strands, eyes)
# before downsampling so they survive at low resolution.
radius = 2
iterations = 1

[features]
saliency_weight = 4.0
lock_feature_colors = true
