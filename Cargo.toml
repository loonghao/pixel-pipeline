[workspace]
resolver = "2"
members = [
    "apps/pixelpipe",
    "crates/pixel-formats",
    "crates/pixel-core",
    "crates/pixel-qa",
    "crates/pixel-cache",
    "crates/pixel-provider",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loonghao/pixel-pipeline"
homepage = "https://github.com/loonghao/pixel-pipeline"
authors = ["Pixel Pipeline contributors"]
description = "Agent-first Rust true-pixel asset compiler."

[workspace.dependencies]
pixel-formats = { path = "crates/pixel-formats", version = "0.1.0" }
pixel-core = { path = "crates/pixel-core", version = "0.1.0" }
pixel-qa = { path = "crates/pixel-qa", version = "0.1.0" }
pixel-cache = { path = "crates/pixel-cache", version = "0.1.0" }
pixel-provider = { path = "crates/pixel-provider", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
rayon = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
